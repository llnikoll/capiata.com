name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Tipos, lint, build y base de datos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El build necesita las variables públicas. Si no están configuradas como
      # secretos se usan valores de relleno: los accesos a Supabase fallan y la
      # app los maneja mostrando su estado de error (no rompen el build).
      - name: Verificar (tipos + lint + build)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
        run: npm run verify

      # Sólo se ejecuta si el repositorio tiene los secretos de Supabase
      # configurados (Settings → Secrets and variables → Actions).
      - name: Verificar el esquema y las políticas en Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice title=Verificación de base omitida::Faltan los secretos NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 0
          fi
          node scripts/health-check.mjs
